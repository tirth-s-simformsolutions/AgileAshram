<header class="sticky top-0 z-50 bg-[color:var(--color-paper-50)]/80 backdrop-blur-md border-b border-[color:var(--color-paper-300)]">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between" aria-label="Main navigation">
    <!-- Logo + Brand -->
    <a routerLink="/" class="flex items-center gap-3 min-w-0 shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--color-saffron-500)] rounded-lg" aria-label="NagarVaani home">
      <!-- Chakra Wheel SVG -->
      <svg class="size-8 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="var(--color-saffron-500)" stroke-width="2"/>
        <circle cx="16" cy="16" r="4" fill="var(--color-saffron-500)"/>
        @for (spoke of spokes; track spoke) {
          <line
            [attr.x1]="16 + 5 * spoke.cos"
            [attr.y1]="16 + 5 * spoke.sin"
            [attr.x2]="16 + 13 * spoke.cos"
            [attr.y2]="16 + 13 * spoke.sin"
            stroke="var(--color-saffron-500)"
            stroke-width="1.5"
            stroke-linecap="round"/>
        }
      </svg>
      <div class="flex flex-col leading-tight min-w-0">
        <span class="text-base font-bold text-[color:var(--color-primary-900)] truncate" style="font-family: var(--font-display)">NagarVaani</span>
        <span class="text-xs text-[color:var(--color-ink-500)] hidden md:block truncate" style="font-family: var(--font-sans)">नगरवाणी — आपकी आवाज़, आपका शहर</span>
      </div>
    </a>

    <!-- User area -->
    <div class="flex items-center gap-3 shrink-0">
      @if (currentUser()) {
        <!-- Avatar chip -->
        <div
          class="size-8 rounded-full flex items-center justify-center text-xs font-bold select-none"
          style="background-color: var(--color-saffron-100); color: var(--color-saffron-700);"
          [attr.title]="currentUser()!.name"
          aria-hidden="true">
          {{ userInitials() }}
        </div>
        <span class="text-sm font-medium text-[color:var(--color-ink-700)] hidden sm:block truncate max-w-32">
          {{ currentUser()!.name }}
        </span>
        <!-- Logout button -->
        <button
          type="button"
          (click)="logout()"
          aria-label="Log out"
          class="flex items-center gap-1.5 text-sm text-[color:var(--color-ink-500)] hover:text-[color:var(--color-danger-600)] transition-colors px-2 py-1.5 rounded-lg hover:bg-[color:var(--color-paper-200)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--color-saffron-500)]">
          <svg class="size-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="M7 16H4a1 1 0 01-1-1V5a1 1 0 011-1h3M13 14l3-4m0 0l-3-4m3 4H7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="hidden sm:inline">Log out</span>
        </button>
      }
    </div>
  </nav>
  <!-- Tricolor rule hairline -->
  <div class="tricolor-rule" aria-hidden="true"></div>
</header>
