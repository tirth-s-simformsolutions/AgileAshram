<div class="relative">
  @if (!selectedFile()) {
    <!-- Drop zone -->
    <div
      class="border-2 border-dashed rounded-[var(--radius-control)] p-6 text-center transition-all duration-150 cursor-pointer"
      [class.border-[color:var(--color-saffron-500)]]="isDragOver()"
      [class.bg-[color:var(--color-saffron-50)]]="isDragOver()"
      [class.border-[color:var(--color-paper-400)]]="!isDragOver()"
      [class.bg-[color:var(--color-paper-100)]]="!isDragOver()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      (click)="fileInput.click()"
      (keydown.enter)="fileInput.click()"
      (keydown.space)="fileInput.click()"
      tabindex="0"
      role="button"
      aria-label="Upload image — click or drag a file here">
      <svg
        class="size-8 mx-auto mb-2 transition-colors"
        [style.color]="isDragOver() ? 'var(--color-saffron-500)' : 'var(--color-ink-400)'"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M4 16l4-4 4 4m0 0l4-4 4 4M12 12V4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="18" width="18" height="2" rx="1" fill="currentColor" stroke="none"/>
      </svg>
      <p class="text-sm font-medium" [style.color]="isDragOver() ? 'var(--color-saffron-600)' : 'var(--color-ink-700)'" style="font-family: var(--font-sans)">
        @if (isDragOver()) {
          Drop your image here
        } @else {
          Add a photo <span class="text-[color:var(--color-ink-400)] font-normal">or drag &amp; drop</span>
        }
      </p>
      <p class="text-xs mt-1 text-[color:var(--color-ink-400)]" style="font-family: var(--font-sans)">PNG, JPG up to 10 MB</p>
    </div>
    <input
      #fileInput
      type="file"
      accept="image/*"
      class="sr-only"
      aria-label="Choose image file"
      (change)="onFileSelected($event)">
  } @else {
    <!-- Preview -->
    <div class="relative rounded-[var(--radius-control)] overflow-hidden border border-[color:var(--color-paper-300)]">
      <img
        [src]="previewUrl()"
        alt="Preview of attached image"
        class="w-full max-h-48 object-cover">
      <button
        type="button"
        (click)="removeFile()"
        aria-label="Remove image"
        class="absolute top-2 right-2 size-7 rounded-full flex items-center justify-center transition-colors shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--color-saffron-500)]"
        style="background: rgba(28,37,51,0.7);">
        <svg class="size-4 text-white" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <line x1="4" y1="4" x2="12" y2="12" stroke-linecap="round"/>
          <line x1="12" y1="4" x2="4" y2="12" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="px-3 py-2 bg-[color:var(--color-paper-50)] border-t border-[color:var(--color-paper-300)]">
        <p class="text-xs text-[color:var(--color-ink-500)] truncate" style="font-family: var(--font-mono)">{{ selectedFile()!.name }}</p>
      </div>
    </div>
  }
</div>
