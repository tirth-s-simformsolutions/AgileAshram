<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy background -->
  <rect width="32" height="32" rx="6" fill="#16264E"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#C9A84C" stroke-width="1.8"/>
  <!-- Inner hub -->
  <circle cx="16" cy="16" r="3.5" fill="#C9A84C"/>
  <!-- 8 spokes -->
  <line x1="16" y1="4.5"  x2="16" y2="12.5" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16" y1="19.5" x2="16" y2="27.5" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="4.5"  y1="16" x2="12.5" y2="16" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="19.5" y1="16" x2="27.5" y2="16" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="7.5"  y1="7.5"  x2="13.3" y2="13.3" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="18.7" y1="18.7" x2="24.5" y2="24.5" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24.5" y1="7.5"  x2="18.7" y2="13.3" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="13.3" y1="18.7" x2="7.5"  y2="24.5" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Center white dot -->
  <circle cx="16" cy="16" r="1.5" fill="#FFFFFF"/>
</svg>
